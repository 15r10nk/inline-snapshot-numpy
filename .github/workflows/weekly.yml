name: Weekly Cog Update

on:
  schedule:
  - cron: 0 8 * * 5      # Every Friday at 08:00 UTC
  workflow_dispatch:

jobs:
  weekly-update:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: '3.12'

    - name: Install Python
      run: uv python install

    - name: Configure Git author
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

    - name: Update Copier template
      run: |
        uvx --from 'copier>=9.10,<10' copier update --defaults --trust
        git add --all
        git diff --cached --check
        if ! git diff --cached --quiet; then
          git commit -m 'chore: update Copier template'
        fi

    - name: Run cog update
      run: |
        git ls-files -z -- '*.py' '*.md' | xargs -0 -r uv run --group cog cog -r
        git add --all
        if ! git diff --cached --quiet; then
          git commit -m 'chore: regenerate cog content'
        fi

    - name: Update GitHub Actions
      run: |
        uvx gha-update
        git add --all
        if ! git diff --cached --quiet; then
          git commit -m 'chore: update GitHub Actions'
        fi

    - name: Update hook revisions
      run: |
        uvx prek update
        git add --all
        if ! git diff --cached --quiet; then
          git commit -m 'chore: update hook revisions'
        fi

    - name: Run formatting hooks
      run: |
        uvx prek run --all-files || uvx prek run --all-files
        git add --all
        if ! git diff --cached --quiet; then
          git commit -m 'style: apply formatting hooks'
        fi

    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        client-id: ${{vars.RELEASE_APP_CLIENT_ID}}
        private-key: ${{secrets.RELEASE_APP_PRIVATE_KEY}}
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{steps.app-token.outputs.token}}
        title: 'chore: weekly update'
        body: Automated weekly update via scheduled workflow.
        branch: chore/weekly-update
        delete-branch: true
        reviewers: 15r10nk
